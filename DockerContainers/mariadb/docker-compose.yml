services:
  db:
    image: mariadb:lts
    restart: always
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: ./datadir
        target: /var/lib/mysql
        read_only: false
      - type: bind
        source: ./backup
        target: /backup
        read_only: false
